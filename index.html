document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

to Sans';\n  font-style: italic;\n  font-weight: 300 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"8334bca2-a3cf-4528-8762-99a29a455aaa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: italic;\n  font-weight: 300 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"ed4eee32-36d9-457a-81b9-cae2cfabdc17\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 300 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"325766a0-92d6-4811-8222-11e62e1e5dc7\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 300 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"bbcd3316-fbe4-4637-a544-81169817501c\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 300 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"4c9659cc-2813-4f1d-9123-40ce7c3cf202\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 300 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"20d5081c-12d6-459b-96e1-d930b219a9f2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 300 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b8abf2f0-df95-4e9a-a3c2-7def2deff707\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* TLV Patient Care — Colour\n   Source of truth: uploads/3-Color-Palette.jpg (\"Color Palette - 3\"), which\n   supersedes the earlier six-swatch artwork. Named values are used verbatim.\n\n   Primary order, per the client: 1 Trust Teal · 2 Sky Blue · 3 Fresh Green ·\n   4 Violet. (The reference image shows Violet first; it is the fourth primary.)\n   Base ramps are built out from those; neutrals are warmed so the system never\n   reads cold or clinical. */\n:root{\n  /* ---- Named palette values (verbatim) ---- */\n  --swatch-trust-teal:#238c9b;  --swatch-sky-blue:#61a2d2;  --swatch-fresh-green:#a7cb75;\n  --swatch-violet:#842c9d;\n  --swatch-soft-blue:#86c0e4;   --swatch-aqua:#45b6cd;      --swatch-mint:#4ec1b1;\n  --swatch-mist:#eaf5f7;        --swatch-warm-white:#f8f7f4;\n  --swatch-eggplant:#5a214e;    --swatch-eggplant-hover:#42183a;\n\n  /* ---- 1 · Trust Teal (primary) ---- */\n  --teal-50:#eaf5f7; --teal-100:#cfe9ed; --teal-200:#a4d6de; --teal-300:#6dbecb;\n  --teal-400:#3aa2b5; --teal-500:#238c9b; --teal-600:#1c7383; --teal-700:#155c69;\n  --teal-800:#104650; --teal-900:#0b323a; --teal-950:#062025;\n\n  /* ---- 2 · Sky Blue ---- */\n  --blue-50:#edf6fc; --blue-100:#d5eaf7; --blue-200:#b0d8ef; --blue-300:#86c0e4;\n  --blue-400:#61a2d2; --blue-500:#4787bc; --blue-600:#376e9b; --blue-700:#2a567a;\n\n  /* ---- 3 · Fresh Green (hope, growth, \"good news\") ---- */\n  --green-50:#f3f8ea; --green-100:#e4f0cf; --green-200:#cde3a8; --green-300:#b9d78f;\n  --green-400:#a7cb75; --green-500:#91ba5d; --green-600:#769c46; --green-700:#5c7a36;\n  --green-800:#435a28;\n\n  /* ---- 4 · Violet ----\n     The fourth primary. Warm because every lighter step leans magenta/mauve\n     rather than blue-violet, and because it is only ever accented with Fresh\n     Green or Mint — never with a cool grey. */\n  --violet-50:#f8effa; --violet-100:#f0ddf4; --violet-200:#e0bbe9; --violet-300:#c890d7;\n  --violet-400:#a856bd; --violet-500:#842c9d; --violet-600:#6c2481; --violet-700:#551c66;\n  --violet-800:#3e144b; --violet-900:#2a0e33;\n\n  /* ---- Eggplant (contrast CTA) ----\n     The high-contrast call-to-action fill supplied with the palette. 700 keeps\n     the earlier #2d1c3e as the pressed / deepest surface step. */\n  --eggplant-50:#f6eef3; --eggplant-100:#e8d5e2; --eggplant-200:#c9a3bd;\n  --eggplant-300:#a06e91; --eggplant-400:#7a3d69; --eggplant-500:#5a214e;\n  --eggplant-600:#42183a; --eggplant-700:#2d1c3e; --eggplant-800:#1e1129;\n\n  /* ---- Mint ---- */\n  --mint-50:#eaf9f6; --mint-100:#cff2ec; --mint-200:#a2e6db; --mint-300:#74d8c8;\n  --mint-400:#4ec1b1; --mint-500:#3ba999; --mint-600:#2f8a7d; --mint-700:#256d62;\n\n  /* ---- Aqua ---- */\n  --aqua-50:#e9f7fa; --aqua-100:#cbedf4; --aqua-200:#9dddeb; --aqua-300:#6bc9dd;\n  --aqua-400:#45b6cd; --aqua-500:#369bb2; --aqua-600:#2a7c90;\n\n  /* ---- Warm neutrals (Warm White is --warm-25, Mist is --teal-50) ---- */\n  --warm-0:#ffffff;  --warm-25:#f8f7f4; --warm-50:#f2f1ec; --warm-100:#eae8e1;\n  --warm-200:#dbd8cf; --warm-300:#c4c0b6; --warm-400:#a29d92; --warm-500:#807a6f;\n  --warm-600:#615c52; --warm-700:#46423a; --warm-800:#2e2b26; --warm-900:#1b1915;\n\n  /* ---- Extended semantics (harmonised, not from the palette) ---- */\n  --amber-50:#fbf1de; --amber-500:#c9832b; --amber-700:#8f5b17;\n  --clay-50:#fbeae7;  --clay-500:#c2483c;  --clay-700:#8e3128;\n\n  /* ============ Semantic aliases — use these in product code ============ */\n  --brand:var(--teal-500);\n  --brand-hover:var(--teal-600);\n  --brand-active:var(--teal-700);\n  --brand-soft:var(--teal-50);\n  --brand-soft-border:var(--teal-200);\n  --brand-ink:var(--teal-800);\n\n  --accent:var(--green-400);\n  --accent-hover:var(--green-500);\n  --accent-active:var(--green-600);\n  --accent-soft:var(--green-50);\n  --accent-ink:var(--green-800);\n\n  --violet:var(--violet-500);\n  --violet-hover:var(--violet-600);\n  --violet-active:var(--violet-700);\n  --violet-soft:var(--violet-50);\n  --violet-ink:var(--violet-700);\n\n  /* Contrast CTA — the highest-emphasis action in the system */\n  --cta:var(--eggplant-500);\n  --cta-hover:var(--eggplant-600);\n  --cta-active:var(--eggplant-700);\n  --cta-on:var(--warm-0);\n\n  --accent-dark:var(--eggplant-700);\n  --accent-dark-hover:var(--eggplant-600);\n  --accent-dark-active:var(--eggplant-800);\n  --accent-dark-soft:var(--eggplant-50);\n  --accent-dark-ink:var(--eggplant-600);\n  --accent-dark-on:var(--eggplant-100);\n\n  --text-strong:var(--teal-900);\n  --text-body:var(--warm-800);\n  --text-muted:var(--warm-600);\n  --text-subtle:var(--warm-500);\n  --text-inverse:var(--warm-0);\n  --text-link:var(--teal-600);\n  --text-link-hover:var(--teal-800);\n\n  --surface-page:var(--warm-25);\n  --surface-card:var(--warm-0);\n  --surface-sunken:var(--warm-50);\n  --surface-raised:var(--warm-0);\n  --surface-brand:var(--teal-500);\n  --surface-brand-deep:var(--teal-900);\n  --surface-brand-soft:var(--teal-50);\n  --surface-mist:var(--teal-50);\n  --surface-violet:var(--violet-500);\n  --surface-violet-soft:var(--violet-50);\n  --surface-eggplant:var(--eggplant-700);\n  --surface-eggplant-soft:var(--eggplant-50);\n  --surface-accent-soft:var(--green-50);\n  --surface-info-soft:var(--aqua-50);\n\n  --border-subtle:var(--warm-100);\n  --border-default:var(--warm-200);\n  --border-strong:var(--warm-300);\n  --border-brand:var(--teal-300);\n\n  --success:var(--green-600);      --success-soft:var(--green-50);   --success-ink:var(--green-800);\n  --info:var(--aqua-500);          --info-soft:var(--aqua-50);       --info-ink:var(--aqua-600);\n  --warning:var(--amber-500);      --warning-soft:var(--amber-50);   --warning-ink:var(--amber-700);\n  --danger:var(--clay-500);        --danger-soft:var(--clay-50);     --danger-ink:var(--clay-700);\n\n  --focus-ring:0 0 0 4px rgba(69,182,205,.45);\n  --focus-ring-inverse:0 0 0 4px rgba(255,255,255,.65);\n\n  /* Signature gradient — left-to-right across the palette. Used at large scale\n     only (hero washes, 4-6px rules), never behind body copy. */\n  --gradient-hope:linear-gradient(90deg,var(--green-400) 0%,var(--mint-400) 24%,var(--aqua-400) 46%,var(--blue-300) 68%,var(--teal-500) 86%,var(--violet-500) 100%);\n  --gradient-calm:linear-gradient(160deg,var(--teal-50) 0%,var(--aqua-50) 55%,var(--green-50) 100%);\n  /* Dusk — the reversed-section gradient. Warm because it arrives at eggplant\n     through teal and violet, never through blue. */\n  --gradient-dusk:linear-gradient(150deg,var(--teal-700) 0%,var(--violet-700) 52%,var(--eggplant-700) 100%);\n}\n<\u002Fstyle>\n<style>/* TLV Patient Care — Type\n   Elms Sans for headings, Nunito Sans for everything read at length.\n   Sizes run one step larger than a typical product system: the primary\n   audience is 65+, so 18px is the floor for body copy, not 14px. */\n:root{\n  --font-display:'Elms Sans','Elms Sans Variable',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-body:'Nunito Sans','Nunito Sans Variable',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;\n\n  --weight-light:300; --weight-regular:400; --weight-medium:500;\n  --weight-semibold:600; --weight-bold:700; --weight-extrabold:800;\n\n  /* Step scale — 1.25 major third above 20px, tighter below */\n  --size-caption:15px;\n  --size-small:16px;\n  --size-body:18px;\n  --size-body-lg:20px;\n  --size-lead:23px;\n  --size-h5:22px;\n  --size-h4:26px;\n  --size-h3:32px;\n  --size-h2:40px;\n  --size-h1:52px;\n  --size-display:66px;\n  --size-display-lg:84px;\n\n  --leading-tight:1.12;\n  --leading-snug:1.25;\n  --leading-normal:1.45;\n  --leading-relaxed:1.6;\n  --leading-loose:1.75;\n\n  --tracking-tight:-0.02em;\n  --tracking-snug:-0.01em;\n  --tracking-normal:0;\n  --tracking-wide:0.02em;\n  --tracking-caps:0.09em;\n\n  --measure-narrow:34ch;\n  --measure:62ch;\n  --measure-wide:78ch;\n\n  /* Composed roles */\n  --text-display:var(--weight-bold) var(--size-display)/var(--leading-tight) var(--font-display);\n  --text-h1:var(--weight-bold) var(--size-h1)/var(--leading-tight) var(--font-display);\n  --text-h2:var(--weight-bold) var(--size-h2)/var(--leading-snug) var(--font-display);\n  --text-h3:var(--weight-semibold) var(--size-h3)/var(--leading-snug) var(--font-display);\n  --text-h4:var(--weight-semibold) var(--size-h4)/var(--leading-snug) var(--font-display);\n  --text-h5:var(--weight-semibold) var(--size-h5)/var(--leading-normal) var(--font-display);\n  --text-lead:var(--weight-regular) var(--size-lead)/var(--leading-relaxed) var(--font-body);\n  --text-body-role:var(--weight-regular) var(--size-body)/var(--leading-relaxed) var(--font-body);\n  --text-small-role:var(--weight-regular) var(--size-small)/var(--leading-normal) var(--font-body);\n  --text-eyebrow:var(--weight-bold) var(--size-caption)/1.2 var(--font-body);\n}\n<\u002Fstyle>\n<style>/* TLV Patient Care — Space, size, radius\n   Touch targets are deliberately large: 56px is the standard control height,\n   48px the absolute floor. Nothing tappable is smaller. */\n:root{\n  --space-0:0;    --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px;\n  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px; --space-9:48px;\n  --space-10:64px; --space-11:80px; --space-12:96px; --space-13:128px; --space-14:160px;\n\n  --gutter:24px;\n  --gutter-lg:40px;\n  --section-y:96px;\n  --section-y-lg:128px;\n  --container:1200px;\n  --container-narrow:760px;\n  --container-wide:1440px;\n\n  --control-h-sm:48px;\n  --control-h:56px;\n  --control-h-lg:64px;\n  --control-pad-x:24px;\n  --tap-min:48px;\n\n  --radius-xs:6px;\n  --radius-sm:10px;\n  --radius-md:14px;\n  --radius-lg:20px;\n  --radius-xl:28px;\n  --radius-2xl:36px;\n  --radius-pill:999px;\n\n  --border-width:1px;\n  --border-width-strong:2px;\n  --rule-brand:6px;\n}\n<\u002Fstyle>\n<style>/* TLV Patient Care — Elevation\n   Shadows are tinted with the deep teal rather than pure black, so cards sit\n   on the warm page without a grey halo. Elevation is soft and low-contrast. */\n:root{\n  --shadow-xs:0 1px 2px rgba(10,50,58,.05);\n  --shadow-sm:0 1px 2px rgba(10,50,58,.05),0 2px 6px -2px rgba(10,50,58,.08);\n  --shadow-md:0 2px 4px rgba(10,50,58,.04),0 10px 24px -8px rgba(10,50,58,.14);\n  --shadow-lg:0 4px 8px rgba(10,50,58,.04),0 24px 48px -16px rgba(10,50,58,.18);\n  --shadow-xl:0 8px 16px rgba(10,50,58,.05),0 40px 80px -24px rgba(10,50,58,.22);\n  --shadow-inset:inset 0 1px 2px rgba(10,50,58,.06);\n  --shadow-card:var(--shadow-sm);\n  --shadow-card-hover:var(--shadow-md);\n  --shadow-overlay:var(--shadow-xl);\n}\n<\u002Fstyle>\n<style>/* TLV Patient Care — Motion\n   Calm and unhurried. Fades and short travel only; no bounce, no spring, no\n   parallax. Motion never carries meaning on its own. */\n:root{\n  --duration-instant:80ms; /* @kind other */\n  --duration-fast:140ms; /* @kind other */\n  --duration-base:220ms; /* @kind other */\n  --duration-slow:320ms; /* @kind other */\n  --duration-page:420ms; /* @kind other */\n\n  --ease-out:cubic-bezier(.2,.8,.3,1); /* @kind other */\n  --ease-in-out:cubic-bezier(.45,.05,.35,1); /* @kind other */\n  --ease-entrance:cubic-bezier(.16,.84,.44,1); /* @kind other */\n\n  --transition-control:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out),transform var(--duration-fast) var(--ease-out);\n  --transition-surface:box-shadow var(--duration-base) var(--ease-out),transform var(--duration-base) var(--ease-out);\n\n  --lift-hover:translateY(-2px); /* @kind other */\n  --press-scale:scale(.985); /* @kind other */\n}\n@media (prefers-reduced-motion:reduce){\n  :root{\n    --duration-instant:0ms; /* @kind other */\n    --duration-fast:0ms; /* @kind other */\n    --duration-base:0ms; /* @kind other */\n    --duration-slow:0ms; /* @kind other */\n    --duration-page:0ms; /* @kind other */\n    --lift-hover:none; /* @kind other */\n    --press-scale:none; /* @kind other */\n  }\n}\n<\u002Fstyle>\n<style>/* TLV Patient Care — Base element defaults\n   Thin layer only: page background, body type, link colour, focus ring. */\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--text-body-role);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nh1,h2,h3,h4,h5{margin:0;color:var(--text-strong);font-family:var(--font-display);letter-spacing:var(--tracking-snug);text-wrap:balance}\nh1{font:var(--text-h1)}h2{font:var(--text-h2)}h3{font:var(--text-h3)}h4{font:var(--text-h4)}h5{font:var(--text-h5)}\np{margin:0 0 var(--space-5);max-width:var(--measure);text-wrap:pretty}\na{color:var(--text-link);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;transition:color var(--duration-fast) var(--ease-out)}\na:hover{color:var(--text-link-hover);text-decoration-thickness:2.5px}\na:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--teal-600);outline-offset:2px;border-radius:var(--radius-xs)}\nstrong,b{font-weight:var(--weight-bold);color:var(--text-strong)}\nsmall{font-size:var(--size-small)}\nhr{border:0;height:1px;background:var(--border-default);margin:var(--space-8) 0}\nimg,svg{max-width:100%}\n::selection{background:var(--mint-200);color:var(--teal-900)}\n<\u002Fstyle>\n<style>/* TLV Patient Care — Webfonts\n   Headings: Elms Sans (Google Fonts). The brief said \"Elm\"; Elms Sans is the\n   closest available family and is the system's display face.\n   Body: Nunito Sans (Google Fonts).\n   Both are loaded from the Google Fonts CDN — no local binaries are shipped. */\n/* vietnamese */\n@font-face {\n  font-family: 'Elms Sans';\n  font-style: italic;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"91c99ddf-4743-4057-8efd-962445d7210f\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Elms Sans';\n  font-style: italic;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"512d6194-bede-4db8-a643-17912b9660f6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Elms Sans';\n  font-style: italic;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"83dc52af-fd95-4382-b924-d9b4bbc39f67\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Elms Sans';\n  font-style: normal;\n  font-weight: 300 800;\n  font-display: swap;\n  src: url(\"5462e3e0-f835-4371-8e47-9bed6dbf8cd7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, (\"20d5081c-12d6-459b-96e1-d930b219a9f2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 300 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b8abf2f0-df95-4e9a-a3c2-7def2deff707\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* TLV Patient Care — Colour\n   Source of truth: uploads/3-Color-Palette.jpg (\"Color Palette - 3\"), which\n   supersedes the earlier six-swatch artwork. Named values are used verbatim.\n\n   Primary order, per the client: 1 Trust Teal · 2 Sky Blue · 3 Fresh Green ·\n   4 Violet. (The reference image shows Violet first; it is the fourth primary.)\n   Base ramps are built out from those; neutrals are warmed so the system never\n   reads cold or clinical. */\n:root{\n  /* ---- Named palette values (verbatim) ---- */\n  --swatch-trust-teal:#238c9b;  --swatch-sky-blue:#61a2d2;  --swatch-fresh-green:#a7cb75;\n  --swatch-violet:#842c9d;\n  --swatch-soft-blue:#86c0e4;   --swatch-aqua:#45b6cd;      --swatch-mint:#4ec1b1;\n  --swatch-mist:#eaf5f7;        --swatch-warm-white:#f8f7f4;\n  --swatch-eggplant:#5a214e;    --swatch-eggplant-hover:#42183a;\n\n  /* ---- 1 · Trust Teal (primary) ---- */\n  --teal-50:#eaf5f7; --teal-100:#cfe9ed; --teal-200:#a4d6de; --teal-300:#6dbecb;\n  --teal-400:#3aa2b5; --teal-500:#238c9b; --teal-600:#1c7383; --teal-700:#155c69;\n  --teal-800:#104650; --teal-900:#0b323a; --teal-950:#062025;\n\n  /* ---- 2 · Sky Blue ---- */\n  --blue-50:#edf6fc; --blue-100:#d5eaf7; --blue-200:#b0d8ef; --blue-300:#86c0e4;\n  --blue-400:#61a2d2; --blue-500:#4787bc; --blue-600:#376e9b; --blue-700:#2a567a;\n\n  /* ---- 3 · Fresh Green (hope, growth, \"good news\") ---- */\n  --green-50:#f3f8ea; --green-100:#e4f0cf; --green-200:#cde3a8; --green-300:#b9d78f;\n  --green-400:#a7cb75; --green-500:#91ba5d; --green-600:#769c46; --green-700:#5c7a36;\n  --green-800:#435a28;\n\n  /* ---- 4 · Violet ----\n     The fourth primary. Warm because every lighter step leans magenta/mauve\n     rather than blue-violet, and because it is only ever accented with Fresh\n     Green or Mint — never with a cool grey. */\n  --violet-50:#f8effa; --violet-100:#f0ddf4; --violet-200:#e0bbe9; --violet-300:#c890d7;\n  --violet-400:#a856bd; --violet-500:#842c9d; --violet-600:#6c2481; --violet-700:#551c66;\n  --violet-800:#3e144b; --violet-900:#2a0e33;\n\n  /* ---- Eggplant (contrast CTA) ----\n     The high-contrast call-to-action fill supplied with the palette. 700 keeps\n     the earlier #2d1c3e as the pressed / deepest surface step. */\n  --eggplant-50:#f6eef3; --eggplant-100:#e8d5e2; --eggplant-200:#c9a3bd;\n  --eggplant-300:#a06e91; --eggplant-400:#7a3d69; --eggplant-500:#5a214e;\n  --eggplant-600:#42183a; --eggplant-700:#2d1c3e; --eggplant-800:#1e1129;\n\n  /* ---- Mint ---- */\n  --mint-50:#eaf9f6; --mint-100:#cff2ec; --mint-200:#a2e6db; --mint-300:#74d8c8;\n  --mint-400:#4ec1b1; --mint-500:#3ba999; --mint-600:#2f8a7d; --mint-700:#256d62;\n\n  /* ---- Aqua ---- */\n  --aqua-50:#e9f7fa; --aqua-100:#cbedf4; --aqua-200:#9dddeb; --aqua-300:#6bc9dd;\n  --aqua-400:#45b6cd; --aqua-500:#369bb2; --aqua-600:#2a7c90;\n\n  /* ---- Warm neutrals (Warm White is --warm-25, Mist is --teal-50) ---- */\n  --warm-0:#ffffff;  --warm-25:#f8f7f4; --warm-50:#f2f1ec; --warm-100:#eae8e1;\n  --warm-200:#dbd8cf; --warm-300:#c4c0b6; --warm-400:#a29d92; --warm-500:#807a6f;\n  --warm-600:#615c52; --warm-700:#46423a; --warm-800:#2e2b26; --warm-900:#1b1915;\n\n  /* ---- Extended semantics (harmonised, not from the palette) ---- */\n  --amber-50:#fbf1de; --amber-500:#c9832b; --amber-700:#8f5b17;\n  --clay-50:#fbeae7;  --clay-500:#c2483c;  --clay-700:#8e3128;\n\n  /* ============ Semantic aliases — use these in product code ============ */\n  --brand:var(--teal-500);\n  --brand-hover:var(--teal-600);\n  --brand-active:var(--teal-700);\n  --brand-soft:var(--teal-50);\n  --brand-soft-border:var(--teal-200);\n  --brand-ink:var(--teal-800);\n\n  --accent:var(--green-400);\n  --accent-hover:var(--green-500);\n  --accent-active:var(--green-600);\n  --accent-soft:var(--green-50);\n  --accent-ink:var(--green-800);\n\n  --violet:var(--violet-500);\n  --violet-hover:var(--violet-600);\n  --violet-active:var(--violet-700);\n  --violet-soft:var(--violet-50);\n  --violet-ink:var(--violet-700);\n\n  /* Contrast CTA — the highest-emphasis action in the system */\n  --cta:var(--eggplant-500);\n  --cta-hover:var(--eggplant-600);\n  --cta-active:var(--eggplant-700);\n  --cta-on:var(--warm-0);\n\n  --accent-dark:var(--eggplant-700);\n  --accent-dark-hover:var(--eggplant-600);\n  --accent-dark-active:var(--eggplant-800);\n  --accent-dark-soft:var(--eggplant-50);\n  --accent-dark-ink:var(--eggplant-600);\n  --accent-dark-on:var(--eggplant-100);\n\n  --text-strong:var(--teal-900);\n  --text-body:var(--warm-800);\n  --text-muted:var(--warm-600);\n  --text-subtle:var(--warm-500);\n  --text-inverse:var(--warm-0);\n  --text-link:var(--teal-600);\n  --text-link-hover:var(--teal-800);\n\n  --surface-page:var(--warm-25);\n  --surface-card:var(--warm-0);\n  --surface-sunken:var(--warm-50);\n  --surface-raised:var(--warm-0);\n  --surface-brand:var(--teal-500);\n  --surface-brand-deep:var(--teal-900);\n  --surface-brand-soft:var(--teal-50);\n  --surface-mist:var(--teal-50);\n  --surface-violet:var(--violet-500);\n  --surface-violet-soft:var(--violet-50);\n  --surface-eggplant:var(--eggplant-700);\n  --surface-eggplant-soft:var(--eggplant-50);\n  --surface-accent-soft:var(--green-50);\n  --surface-info-soft:var(--aqua-50);\n\n  --border-subtle:var(--warm-100);\n  --border-default:var(--warm-200);\n  --border-strong:var(--warm-300);\n  --border-brand:var(--teal-300);\n\n  --success:var(--green-600);      --success-soft:var(--green-50);   --success-ink:var(--green-800);\n  --info:var(--aqua-500);          --info-soft:var(--aqua-50);       --info-ink:var(--aqua-600);\n  --warning:var(--amber-500);      --warning-soft:var(--amber-50);   --warning-ink:var(--amber-700);\n  --danger:var(--clay-500);        --danger-soft:var(--clay-50);     --danger-ink:var(--clay-700);\n\n  --focus-ring:0 0 0 4px rgba(69,182,205,.45);\n  --focus-ring-inverse:0 0 0 4px rgba(255,255,255,.65);\n\n  /* Signature gradient — left-to-right across the palette. Used at large scale\n     only (hero washes, 4-6px rules), never behind body copy. */\n  --gradient-hope:linear-gradient(90deg,var(--green-400) 0%,var(--mint-400) 24%,var(--aqua-400) 46%,var(--blue-300) 68%,var(--teal-500) 86%,var(--violet-500) 100%);\n  --gradient-calm:linear-gradient(160deg,var(--teal-50) 0%,var(--aqua-50) 55%,var(--green-50) 100%);\n  /* Dusk — the reversed-section gradient. Warm because it arrives at eggplant\n     through teal and violet, never through blue. */\n  --gradient-dusk:linear-gradient(150deg,var(--teal-700) 0%,var(--violet-700) 52%,var(--eggplant-700) 100%);\n}\n\n/* TLV Patient Care — Type\n   Elms Sans for headings, Nunito Sans for everything read at length.\n   Sizes run one step larger than a typical product system: the primary\n   audience is 65+, so 18px is the floor for body copy, not 14px. */\n:root{\n  --font-display:'Elms Sans','Elms Sans Variable',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-body:'Nunito Sans','Nunito Sans Variable',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;\n\n  --weight-light:300; --weight-regular:400; --weight-medium:500;\n  --weight-semibold:600; --weight-bold:700; --weight-extrabold:800;\n\n  /* Step scale — 1.25 major third above 20px, tighter below */\n  --size-caption:15px;\n  --size-small:16px;\n  --size-body:18px;\n  --size-body-lg:20px;\n  --size-lead:23px;\n  --size-h5:22px;\n  --size-h4:26px;\n  --size-h3:32px;\n  --size-h2:40px;\n  --size-h1:52px;\n  --size-display:66px;\n  --size-display-lg:84px;\n\n  --leading-tight:1.12;\n  --leading-snug:1.25;\n  --leading-normal:1.45;\n  --leading-relaxed:1.6;\n  --leading-loose:1.75;\n\n  --tracking-tight:-0.02em;\n  --tracking-snug:-0.01em;\n  --tracking-normal:0;\n  --tracking-wide:0.02em;\n  --tracking-caps:0.09em;\n\n  --measure-narrow:34ch;\n  --measure:62ch;\n  --measure-wide:78ch;\n\n  /* Composed roles */\n  --text-display:var(--weight-bold) var(--size-display)/var(--leading-tight) var(--font-display);\n  --text-h1:var(--weight-bold) var(--size-h1)/var(--leading-tight) var(--font-display);\n  --text-h2:var(--weight-bold) var(--size-h2)/var(--leading-snug) var(--font-display);\n  --text-h3:var(--weight-semibold) var(--size-h3)/var(--leading-snug) var(--font-display);\n  --text-h4:var(--weight-semibold) var(--size-h4)/var(--leading-snug) var(--font-display);\n  --text-h5:var(--weight-semibold) var(--size-h5)/var(--leading-normal) var(--font-display);\n  --text-lead:var(--weight-regular) var(--size-lead)/var(--leading-relaxed) var(--font-body);\n  --text-body-role:var(--weight-regular) var(--size-body)/var(--leading-relaxed) var(--font-body);\n  --text-small-role:var(--weight-regular) var(--size-small)/var(--leading-normal) var(--font-body);\n  --text-eyebrow:var(--weight-bold) var(--size-caption)/1.2 var(--font-body);\n}\n\n/* TLV Patient Care — Space, size, radius\n   Touch targets are deliberately large: 56px is the standard control height,\n   48px the absolute floor. Nothing tappable is smaller. */\n:root{\n  --space-0:0;    --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px;\n  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px; --space-9:48px;\n  --space-10:64px; --space-11:80px; --space-12:96px; --space-13:128px; --space-14:160px;\n\n  --gutter:24px;\n  --gutter-lg:40px;\n  --section-y:96px;\n  --section-y-lg:128px;\n  --container:1200px;\n  --container-narrow:760px;\n  --container-wide:1440px;\n\n  --control-h-sm:48px;\n  --control-h:56px;\n  --control-h-lg:64px;\n  --control-pad-x:24px;\n  --tap-min:48px;\n\n  --radius-xs:6px;\n  --radius-sm:10px;\n  --radius-md:14px;\n  --radius-lg:20px;\n  --radius-xl:28px;\n  --radius-2xl:36px;\n  --radius-pill:999px;\n\n  --border-width:1px;\n  --border-width-strong:2px;\n  --rule-brand:6px;\n}\n\n/* TLV Patient Care — Elevation\n   Shadows are tinted with the deep teal rather than pure black, so cards sit\n   on the warm page without a grey halo. Elevation is soft and low-contrast. */\n:root{\n  --shadow-xs:0 1px 2px rgba(10,50,58,.05);\n  --shadow-sm:0 1px 2px rgba(10,50,58,.05),0 2px 6px -2px rgba(10,50,58,.08);\n  --shadow-md:0 2px 4px rgba(10,50,58,.04),0 10px 24px -8px rgba(10,50,58,.14);\n  --shadow-lg:0 4px 8px rgba(10,50,58,.04),0 24px 48px -16px rgba(10,50,58,.18);\n  --shadow-xl:0 8px 16px rgba(10,50,58,.05),0 40px 80px -24px rgba(10,50,58,.22);\n  --shadow-inset:inset 0 1px 2px rgba(10,50,58,.06);\n  --shadow-card:var(--shadow-sm);\n  --shadow-card-hover:var(--shadow-md);\n  --shadow-overlay:var(--shadow-xl);\n}\n\n/* TLV Patient Care — Motion\n   Calm and unhurried. Fades and short travel only; no bounce, no spring, no\n   parallax. Motion never carries meaning on its own. */\n:root{\n  --duration-instant:80ms; /* @kind other */\n  --duration-fast:140ms; /* @kind other */\n  --duration-base:220ms; /* @kind other */\n  --duration-slow:320ms; /* @kind other */\n  --duration-page:420ms; /* @kind other */\n\n  --ease-out:cubic-bezier(.2,.8,.3,1); /* @kind other */\n  --ease-in-out:cubic-bezier(.45,.05,.35,1); /* @kind other */\n  --ease-entrance:cubic-bezier(.16,.84,.44,1); /* @kind other */\n\n  --transition-control:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out),box-shadow ce-8) 0}\nimg,svg{max-width:100%}\n::selection{background:var(--mint-200);color:var(--teal-900)}\n\n<\u002Fstyle>\n<script src=\"36f7ed7b-00b1-47c9-b479-0e6b74babbc7\"><\u002Fscript>\n<script src=\"a5061740-6ca9-4bb2-90be-5e15816bb744\"><\u002Fscript>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--text-body-role);-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4,p{margin:0;text-wrap:pretty}\nh1,h2,h3{text-wrap:balance}\n/* Elms Sans sets word spaces wide — pull them in wherever the display face is used */\n/* Both faces set word spaces wider than this brand wants — pull them in everywhere */\nbody,input,textarea,select{word-spacing:-0.1em}\nh1,h2,h3,h4,h5,h6,button{word-spacing:-0.14em}\n/* Display-only leading: these two tokens are used by the Elms Sans roles only */\n:root{--leading-tight:0.97;--leading-snug:1.08}\n\n/* Focus — audience is 65+, so the ring is thick and high-contrast */\n:focus-visible{outline:3px solid var(--teal-600);outline-offset:3px;border-radius:6px}\n\n/* Responsive: the layout is built on fixed two- and three-column grids */\n@media (max-width:1180px){\n  main [data-cols=\"4\"]{grid-template-columns:1fr 1fr!important}\n  main [data-cols=\"3\"]{grid-template-columns:1fr 1fr!important}\n  main [data-split]{grid-template-columns:1fr .8fr!important}\n}\n@media (max-width:900px){\n  main [style*=\"grid-template-columns\"]{grid-template-columns:1fr!important}\n  main [data-cols],main [data-split]{grid-template-columns:1fr!important}\n  main [data-sticky]{position:static!important}\n  main section{padding-inline:var(--space-5)!important}\n  main h1{font-size:clamp(38px,7vw,56px)!important}\n  main h2{font-size:clamp(30px,5.5vw,42px)!important}\n  footer > div{grid-template-columns:1fr 1fr!important}\n  header nav{order:3;width:100%}\n}\n@media (max-width:760px){\n  header [data-hide-sm]{display:none!important}\n  header > div:last-child{height:auto!important;flex-wrap:wrap;padding-block:var(--space-4)!important}\n}\n@media (prefers-reduced-motion:reduce){\n  [data-reveal]{opacity:1;animation:none!important}\n  *{scroll-behavior:auto!important}\n}\na{color:var(--text-link);text-decoration:none}\na:hover{color:var(--text-link-hover);text-decoration:underline}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<header style=\"position:sticky;top:0;z-index:30;background:rgba(253,251,248,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle);box-shadow:var(--hdr-shadow,none);transition:box-shadow var(--dur-2, .2s) ease\">\n  <div style=\"height:6px;background:var(--gradient-hope)\"><\u002Fdiv>\n  <div style=\"max-width:var(--container);margin:0 auto;padding:0 var(--space-7);height:88px;display:flex;align-items:center;gap:var(--space-4)\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center\">\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Wordmark\" form=\"medium\" size=\"26\" hint-size=\"200px,32px\"><\u002Fx-import>\n    <\u002Fbutton>\n    <nav style=\"display:flex;gap:2px;margin-inline-start:auto\">\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"min-height:48px;padding:0 14px;background:var(--nav-home-bg);border:0;border-radius:var(--radius-pill);font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--nav-home-fg);cursor:pointer;transition:background var(--dur-1,.15s) ease,color var(--dur-1,.15s) ease\" style-hover=\"background:var(--teal-50);color:var(--teal-800)\">Home<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goServices }}\" style=\"min-height:48px;padding:0 14px;background:var(--nav-services-bg);border:0;border-radius:var(--radius-pill);font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--nav-services-fg);cursor:pointer;transition:background var(--dur-1,.15s) ease,color var(--dur-1,.15s) ease\" style-hover=\"background:var(--teal-50);color:var(--teal-800)\">Services<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goAbout }}\" style=\"min-height:48px;padding:0 14px;background:var(--nav-about-bg);border:0;border-radius:var(--radius-pill);font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--nav-about-fg);cursor:pointer;transition:background var(--dur-1,.15s) ease,color var(--dur-1,.15s) ease\" style-hover=\"background:var(--teal-50);color:var(--teal-800)\">About<\u002Fbutton>\n    <\u002Fnav>\n    <a href=\"tel:5550128834\" data-hide-sm=\"\" style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--teal-700);white-space:nowrap\">\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"phone\" size=\"20px\" hint-size=\"20px,20px\"><\u002Fx-import>(555) 012-8834<\u002Fa>\n    <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"accent\" size=\"sm\" sc-camel-on-click=\"{{ book }}\" hint-size=\"auto,48px\">Book a free call<\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<main data-screen-label=\"Home\">\n\n  <section style=\"background:var(--gradient-calm);padding:var(--section-y-lg) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;gap:var(--space-10);align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">TLV Patient Care Consulting<\u002Fspan>\n        <sc-if value=\"{{ hlPrimary }}\" hint-placeholder-val=\"{{ false }}\"><h1 style=\"font:var(--text-display);letter-spacing:var(--tracking-tight);color:var(--text-strong);max-width:19ch\">Helping you manage your parent's healthcare with clarity and confidence.<\u002Fh1><\u002Fsc-if>\n        <sc-if value=\"{{ hlB }}\" hint-placeholder-val=\"{{ false }}\"><h1 style=\"font:var(--text-display);letter-spacing:var(--tracking-tight);color:var(--text-strong);max-width:19ch\">Support for your parent. Greater peace of mind for your family.<\u002Fh1><\u002Fsc-if>\n        <sc-if value=\"{{ hlC }}\" hint-placeholder-val=\"{{ true }}\"><h1 style=\"font:var(--text-h1);letter-spacing:var(--tracking-tight);color:var(--text-strong);max-width:22ch\">Patient advocacy and healthcare navigation for seniors and the families supporting them.<\u002Fh1><\u002Fsc-if>\n        <sc-if value=\"{{ hlD }}\" hint-placeholder-val=\"{{ false }}\"><h1 style=\"font:var(--text-display);letter-spacing:var(--tracking-tight);color:var(--text-strong);max-width:19ch\">Helping important healthcare details stay clear, organized, and understood.<\u002Fh1><\u002Fsc-if>\n        <p style=\"font:var(--text-lead);color:var(--text-muted);max-width:52ch\">TLV Patient Care supports seniors and their families with patient portals, medical information, appointment preparation, and healthcare coordination, so important details do not get lost.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:center;margin-top:var(--space-2)\">\n          <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"cta\" size=\"lg\" icon-left=\"calendar-check\" sc-camel-on-click=\"{{ book }}\" hint-size=\"auto,64px\">Book a free 30-minute consultation<\u002Fx-import>\n          <button sc-camel-on-click=\"{{ goServices }}\" style=\"background:none;border:0;padding:0;min-height:48px;display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:var(--size-body-lg);font-weight:600;color:var(--teal-700);cursor:pointer\">See how TLV can help\n            <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"arrow-right\" size=\"22px\" hint-size=\"22px,22px\"><\u002Fx-import><\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showTrust }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);align-items:center;padding-top:var(--space-4);border-top:1px solid var(--teal-100);width:100%;margin-top:var(--space-2)\">\n          <span style=\"font:var(--text-small-role);color:var(--teal-700)\">For seniors, adult children, and family caregivers<\u002Fspan>\n          <span style=\"width:5px;height:5px;border-radius:50%;background:var(--teal-300)\"><\u002Fspan>\n          <span style=\"font:var(--text-small-role);color:var(--teal-700)\">Independent support<\u002Fspan>\n          <span style=\"width:5px;height:5px;border-radius:50%;background:var(--teal-300)\"><\u002Fspan>\n          <span style=\"font:var(--text-small-role);color:var(--teal-700)\">In-person, virtual, and hybrid options<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:600px;border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-md)\">\n        <image-slot id=\"tlv-hero\" shape=\"rect\" placeholder=\"Hero photograph — a senior and their adult child or support person together in a calm, real-life setting, at close range. Reaching-hand or supportive-hand motif. Bright, daylight, warm white balance. Hopeful and capable, not sad or medical. Partners in the process, not a helper standing over a helpless senior. Leave clean space on the left.\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-card);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-10);align-items:center\">\n      <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:22ch\">When a diagnosis changes everything, the details can become difficult to manage.<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start\">\n        <p style=\"font:var(--text-lead);color:var(--text-body);max-width:56ch\">Appointments, portal messages, medical records, unfamiliar terms, and follow-up instructions can quickly become overwhelming. TLV Patient Care helps your family slow the process down, understand the information, prepare the right questions, and keep the next steps organized.<\u002Fp>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ goServices }}\" icon-right=\"arrow-right\" hint-size=\"auto,56px\">Explore our services<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-9)\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">Practical support<\u002Fspan>\n        <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:24ch\">What we actually do for your family<\u002Fh2>\n        <p style=\"font:var(--text-lead);color:var(--text-muted);max-width:52ch\">Whether you live nearby or in another city, we help you and your parent stay informed, prepared, and more confident about what comes next.<\u002Fp>\n      <\u002Fdiv>\n      <div data-cols=\"4\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-6)\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" icon=\"monitor-smartphone\" title=\"Patient portals\" hint-size=\"100%,300px\">Set up portal access, fix notifications so alerts arrive, and teach your parent how to log in, read lab results, and message their care team.<\u002Fx-import>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" icon=\"notebook-pen\" title=\"Appointment preparation\" hint-size=\"100%,300px\">Sit down before a major appointment, review labs and scans together, and write down the questions that need answering.<\u002Fx-import>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" icon=\"folder-open\" title=\"Records and information\" hint-size=\"100%,300px\">Organize records, keep the medication list accurate, and research reliable information so your family is working from the same page.<\u002Fx-import>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" icon=\"list-checks\" title=\"What happens next\" hint-size=\"100%,300px\">Track follow-up instructions, appointments, and next steps, so nothing important is missed after everyone leaves the room.<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-brand-deep);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:.9fr 1.1fr;gap:var(--space-10);align-items:center\">\n      <div style=\"position:relative;height:440px;border-radius:var(--radius-xl);overflow:hidden;background:var(--surface-mist)\">\n        <image-slot id=\"tlv-senior\" shape=\"rect\" placeholder=\"Photograph — a senior at their own kitchen table, phone or tablet in hand, being helped with it rather than watched. Relaxed face, own home, own clothes. Bright and warm. No scrubs, no hospital.\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--mint-300)\">Peace of mind<\u002Fspan>\n        <h2 style=\"font:var(--text-h2);color:var(--warm-0);max-width:22ch\">Healthcare should not feel impossible to understand.<\u002Fh2>\n        <p style=\"font:var(--text-lead);color:var(--teal-100);max-width:54ch\">We work alongside seniors at their pace, helping them navigate online systems, prepare for appointments, review information in clear language, and build greater confidence managing their own healthcare.<\u002Fp>\n        <p style=\"font:var(--text-body-role);color:var(--mint-300);max-width:48ch\">You stay in charge of your own care. Bring a family member if you would like. As many times as you need.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-card);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:.85fr 1.15fr;gap:var(--space-10)\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-4)\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">What to expect<\u002Fspan>\n        <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:16ch\">One clear path, from the first call onward<\u002Fh2>\n        <p style=\"font:var(--text-body-role);color:var(--text-muted);max-width:38ch\">No cost, no obligation. You do not have to decide today.<\u002Fp>\n      <\u002Fdiv>\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Steps\" items=\"{{ steps }}\" current=\"{{ stepCurrent }}\" hint-size=\"100%,420px\"><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);align-items:stretch\">\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" tone=\"soft\" icon=\"heart-handshake\" title=\"Independent support\" hint-size=\"100%,340px\">TLV Patient Care is independent from hospitals, insurance companies, and medical facilities. We do not diagnose, prescribe, or recommend treatment. We serve as educators, researchers, advocates and logistics guides, helping clients prepare for more productive conversations with their licensed healthcare professionals.<\u002Fx-import>\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" accent=\"1\" icon=\"user-round\" title=\"Meet Terry\" footer=\"{{ aboutLink }}\" hint-size=\"100%,340px\">Terry Vincent is a retired Principal Surgical Technologist and former UCSF Radiation Oncology staff member with a BA in Psychology from Golden Gate University. Her work is also shaped by decades of caring for her own family through cancer, dementia, disability, hospitalization, and end-of-life care.<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"tlv-book-home\" style=\"background:var(--gradient-dusk);padding:var(--section-y-lg) var(--space-7)\">\n    <div style=\"max-width:var(--container-narrow);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6);align-items:center;text-align:center\">\n      <h2 style=\"font:var(--text-h1);color:var(--warm-0);max-width:24ch\">Every family deserves a clearer path forward.<\u002Fh2>\n      <p style=\"font:var(--text-lead);color:var(--violet-50);max-width:50ch\">When healthcare feels confusing or difficult to manage, you do not have to figure out every detail alone. Let's talk about what your family needs and the support that may help.<\u002Fp>\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"inverse\" size=\"lg\" icon-left=\"calendar-check\" sc-camel-on-click=\"{{ book }}\" hint-size=\"auto,64px\">Book a free 30-minute consultation<\u002Fx-import>\n      <p style=\"font:var(--text-small-role);color:var(--violet-50);opacity:.85\">No cost, no obligation. A person answers.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isServices }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Services\">\n\n  <section style=\"background:var(--gradient-calm);padding:var(--section-y-lg) var(--space-7) var(--section-y)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:var(--space-10);align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">How TLV can help<\u002Fspan>\n        <h1 style=\"font:var(--text-h1);letter-spacing:var(--tracking-tight);color:var(--text-strong);max-width:20ch\">Support built around the problem in front of you.<\u002Fh1>\n        <p style=\"font:var(--text-lead);color:var(--text-muted);max-width:54ch\">Every family arrives at a different point. Some need help logging in. Most want to understand what is happening and what the options are. We start where you are, and the support grows only as far as it needs to.<\u002Fp>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"cta\" size=\"lg\" icon-left=\"calendar-check\" sc-camel-on-click=\"{{ book }}\" hint-size=\"auto,64px\">Book a free 30-minute consultation<\u002Fx-import>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:420px;border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-md)\">\n        <image-slot id=\"tlv-services\" shape=\"rect\" placeholder=\"Photograph — two people at a table looking at the same page of paperwork, pen in hand. Hands and documents in frame. Daylight, wood and linen, warm tones. A plan being written down.\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-card);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-9);align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-5);align-items:flex-start\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Badge\" tone=\"success\" icon=\"phone-call\" hint-size=\"auto,34px\">Free · 30 minutes<\u002Fx-import>\n        <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:20ch\">Start with a free 30-minute consultation<\u002Fh2>\n        <p style=\"font:var(--text-body-role);color:var(--text-body);max-width:54ch\">Tell us what has happened and what is worrying you. We will explain what we can help with, what we cannot, and what the clearest next step looks like. If TLV is not the right fit, we will say so.<\u002Fp>\n        <p style=\"font:var(--text-body-role);color:var(--teal-700);font-weight:600\">No cost, no obligation. Bring a family member if you would like.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)\">\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-6);background:var(--surface-brand-soft);border:1px solid var(--teal-100);border-radius:var(--radius-lg)\">\n          <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"home\" size=\"28px\" color=\"var(--brand)\" hint-size=\"28px,28px\"><\u002Fx-import>\n          <span style=\"font:var(--text-h5);color:var(--text-strong)\">In person<\u002Fspan>\n          <span style=\"font:var(--text-small-role);color:var(--text-muted)\">Home visits before an appointment, and in the clinic beside you.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-6);background:var(--surface-brand-soft);border:1px solid var(--teal-100);border-radius:var(--radius-lg)\">\n          <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"video\" size=\"28px\" color=\"var(--brand)\" hint-size=\"28px,28px\"><\u002Fx-import>\n          <span style=\"font:var(--text-h5);color:var(--text-strong)\">Virtual<\u002Fspan>\n          <span style=\"font:var(--text-small-role);color:var(--text-muted)\">For families in another city, at a time that works around work.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-6);background:var(--surface-brand-soft);border:1px solid var(--teal-100);border-radius:var(--radius-lg)\">\n          <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"users\" size=\"28px\" color=\"var(--brand)\" hint-size=\"28px,28px\"><\u002Fx-import>\n          <span style=\"font:var(--text-h5);color:var(--text-strong)\">Hybrid<\u002Fspan>\n          <span style=\"font:var(--text-small-role);color:var(--text-muted)\">We are in the room with your parent, you are on the call from wherever you are.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-6);background:var(--surface-accent-soft);border:1px solid var(--green-100);border-radius:var(--radius-lg)\">\n          <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"file-signature\" size=\"28px\" color=\"var(--green-600)\" hint-size=\"28px,28px\"><\u002Fx-import>\n          <span style=\"font:var(--text-h5);color:var(--text-strong)\">Written access<\u002Fspan>\n          <span style=\"font:var(--text-small-role);color:var(--text-muted)\">A signed proxy gives us access. Nothing happens without it.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-9)\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">Packages<\u002Fspan>\n        <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:22ch\">Each package builds on the one before it<\u002Fh2>\n        <p style=\"font:var(--text-lead);color:var(--text-muted);max-width:56ch\">Flat fees, agreed before anything starts. Prices are not listed here because the right package depends on what you are facing. We will walk you through the cost on your free call.<\u002Fp>\n      <\u002Fdiv>\n      <div data-cols=\"3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6);margin-bottom:var(--space-6)\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" eyebrow=\"Getting set up\" icon=\"monitor-smartphone\" title=\"Educational\" hint-size=\"100%,420px\">\n          <p style=\"margin:0 0 var(--space-5)\">For the family whose parent cannot get into the system at all.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)\">\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Portal login set up and working<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Notifications fixed so alerts actually arrive<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>How to read lab results and schedule with the care team<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Medication list checked for accuracy, and how to reorder<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Proxy access set up for family members<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" accent=\"1\" eyebrow=\"Appointment support\" icon=\"users\" title=\"Premium\" footer=\"{{ mostFamilies }}\" hint-size=\"100%,420px\">\n          <p style=\"margin:0 0 var(--space-5)\">For the family who needs to know what is wrong and what the options are.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)\">\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Everything in Educational<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>A visit before the appointment to review labs and scans and write down questions<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>An advocate in the exam room taking notes, so your parent can listen<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>A debrief afterwards, in plain language, while it is still fresh<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>How to use the care team and how to request a second opinion<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" eyebrow=\"Surgery preparation\" icon=\"clipboard-check\" title=\"Specialty — surgical\" hint-size=\"100%,420px\">\n          <p style=\"margin:0 0 var(--space-5)\">For the family facing a major operation.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)\">\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Everything in Premium<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>The surgical plan reviewed together, at home or virtually<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Questions written for the surgeon before you are in the room<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>What actually happens in the operating room, explained by someone who worked in one<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>How to research the surgeon<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fx-import>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" eyebrow=\"Cancer diagnosis support\" icon=\"route\" title=\"Specialty — cancer\" hint-size=\"100%,380px\">\n          <p style=\"margin:0 0 var(--space-5)\">For the family working through a complex cancer diagnosis and a long treatment plan.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)\">\n
