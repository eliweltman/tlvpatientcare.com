   <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Everything in Specialty — surgical<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>The treatment timeline mapped out, step by step<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Radiation, chemotherapy and surgery explained in clear language, including the difference between the options you were given<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Side effects tracked, so your parent knows what to report and when<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-600)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Reliable published research gathered into questions for the specialist<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" tone=\"deep\" eyebrow=\"Ongoing\" icon=\"calendar-days\" title=\"Monthly care retainer\" hint-size=\"100%,380px\">\n          <p style=\"margin:0 0 var(--space-5)\">For families who want someone watching the chart every week, not only around appointments.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)\">\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-300)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Everything in Specialty — surgical<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-300)\" hint-size=\"22px,22px\"><\u002Fx-import><span>A set number of clinic visits each month<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-300)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Weekly portal monitoring, so new results and messages are seen<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-300)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Records kept organized and current<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:var(--space-3);align-items:flex-start\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"22px\" color=\"var(--green-300)\" hint-size=\"22px,22px\"><\u002Fx-import><span>Billed monthly, cancel whenever you no longer need it<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-card);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-10);align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-5)\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">The outcome<\u002Fspan>\n        <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:20ch\">The goal is not to add another layer of complexity. It is to create clarity.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font:var(--text-lead);color:var(--text-body);max-width:56ch\">Families know what has happened, what needs attention, and what questions to ask next. Seniors feel heard, supported, and more involved in their own healthcare journey.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-7)\">\n    <div data-split=\"\" style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:660px 1fr;gap:var(--space-10);align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-8);align-items:flex-start\">\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-5);align-items:flex-start\">\n          <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">FAQ<\u002Fspan>\n          <h2 style=\"font:var(--text-h2);color:var(--text-strong)\">We are educators, researchers, advocates, and logistics guides.<\u002Fh2>\n          <p style=\"font:var(--text-lead);color:var(--text-body)\">We do not diagnose conditions, prescribe medication, or advise which treatment to choose. What we can do is explain what you were told, gather reliable information, help you write the questions, and make sure the next steps are organized.<\u002Fp>\n          <p style=\"font:var(--text-lead);font-style:italic;color:var(--teal-700)\">Medical decisions remain between the client and their licensed healthcare professionals.<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showFaq }}\" hint-placeholder-val=\"{{ true }}\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Accordion\" items=\"{{ faq }}\" style=\"{{ faqWidth }}\" hint-size=\"100%,320px\"><\u002Fx-import>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:720px;border-radius:var(--radius-xl);overflow:hidden;background:var(--surface-mist);position:sticky;top:120px\" data-sticky=\"\">\n        <image-slot id=\"tlv-faq\" shape=\"rect\" placeholder=\"Photograph, tall crop — an advocate and a client side by side, one pointing at something on a laptop or portal screen while the other follows along. Close range, own home, daylight, warm tones. Two people looking at the same page.\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"tlv-book-services\" style=\"background:var(--gradient-dusk);padding:var(--section-y-lg) var(--space-7)\">\n    <div style=\"max-width:var(--container-narrow);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6);align-items:center;text-align:center\">\n      <h2 style=\"font:var(--text-h1);color:var(--warm-0);max-width:24ch\">Let's talk about what your family needs.<\u002Fh2>\n      <p style=\"font:var(--text-lead);color:var(--violet-50);max-width:50ch\">Thirty minutes, no cost, no obligation. By the end of the call you will know the clearest next step, whether or not it involves TLV.<\u002Fp>\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"inverse\" size=\"lg\" icon-left=\"calendar-check\" sc-camel-on-click=\"{{ book }}\" hint-size=\"auto,64px\">Book a free 30-minute consultation<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"About\">\n\n  <section style=\"background:var(--gradient-calm);padding:var(--section-y-lg) var(--space-7) var(--section-y)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;gap:var(--space-10);align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">Meet Terry<\u002Fspan>\n        <h1 style=\"font:var(--text-h1);letter-spacing:var(--tracking-tight);color:var(--text-strong);max-width:20ch\">Professional healthcare experience. Personal understanding. Practical support for families.<\u002Fh1>\n        <p style=\"font:var(--text-lead);color:var(--text-muted);max-width:54ch\">I created TLV Patient Care to help seniors and their families navigate difficult diagnoses, online healthcare systems, and important next steps with greater clarity and confidence.<\u002Fp>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"cta\" size=\"lg\" icon-left=\"calendar-check\" sc-camel-on-click=\"{{ book }}\" hint-size=\"auto,64px\">Book a free 30-minute consultation<\u002Fx-import>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:520px;border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-md)\">\n        <image-slot id=\"tlv-terry\" shape=\"rect\" placeholder=\"Portrait of Terry — close range, in her own clothes, relaxed and looking at the camera. Daylight, warm white balance, light background. Professional but not clinical. No scrubs, no stethoscope.\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-card);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:.8fr 1.2fr;gap:var(--space-10);align-items:flex-start\">\n      <h2 data-sticky=\"\" style=\"font:var(--text-h2);color:var(--text-strong);max-width:16ch;position:sticky;top:120px\">Why I started TLV Patient Care<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-6);max-width:var(--measure)\">\n        <p style=\"font:var(--text-lead);color:var(--text-body)\">I have spent much of my life helping people understand complicated information, make informed decisions, and feel supported during difficult moments.<\u002Fp>\n        <p>Before entering healthcare, I worked in human resources and benefits, where I helped employees and clients navigate payroll, benefits, employment questions, and complex administrative concerns. That experience taught me how important it is to listen carefully, explain information clearly, and help people find the next practical step.<\u002Fp>\n        <p>In 2001, I began working at UCSF in Radiation Oncology. I later completed Surgical Technologist training and built a long career in the operating room, eventually serving as a Principal Surgical Technologist. My work required precision, calm communication, strict respect for patient privacy, and a constant responsibility to protect and advocate for the patient before, during, and after surgery. During the COVID pandemic, I also served as a first responder in the operating room and ICU.<\u002Fp>\n        <p>I earned a Bachelor of Arts in Psychology from Golden Gate University, graduating magna cum laude in 2002. That education, together with my healthcare experience, shaped the way I work with people today: patiently, respectfully, and without making them feel overwhelmed by information.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:.8fr 1.2fr;gap:var(--space-10);align-items:flex-start\">\n      <div data-sticky=\"\" style=\"display:flex;flex-direction:column;gap:var(--space-6);position:sticky;top:120px\">\n        <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:16ch\">My experience is also personal<\u002Fh2>\n        <div style=\"position:relative;height:300px;border-radius:var(--radius-xl);overflow:hidden;background:var(--surface-mist)\">\n          <image-slot id=\"tlv-family\" shape=\"rect\" placeholder=\"Photograph — two hands, one older, one younger, resting together on a table or an arm of a chair. Close crop, skin tones warm, daylight. The reaching-hand motif. Hopeful, not mournful.\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-6);max-width:var(--measure)\">\n        <p style=\"font:var(--text-lead);color:var(--text-body)\">My understanding of caregiving does not come only from my professional career. It comes from decades of caring for my own family.<\u002Fp>\n        <p>When my mother was diagnosed with breast cancer, I helped manage her daily care until she passed away. After that, I became the primary caregiver for my family. Over the years, I supported my father through dementia and chronic health conditions, helped care for two uncles, managed the ongoing needs of my sister, and helped provide end-of-life care for my mother-in-law. The work included appointments, medications, records, finances, household responsibilities, transportation, emotional support, and the everyday logistics that can become overwhelming when someone is seriously ill.<\u002Fp>\n        <p>In 2025, my brother was hospitalized for three months after being diagnosed with multiple myeloma. Our family received very little direct communication about what was happening. I learned his diagnosis and followed his care by reading the notes in his medical chart. When discharge was being considered without the level of support he needed, I used the information in the record to ask questions, challenge the plan, and help secure continued rehabilitation and around-the-clock care.<\u002Fp>\n        <p>That experience confirmed something I had already seen many times in healthcare: after a difficult diagnosis, people often hear the name of the illness and little else. Important instructions, options, portal messages, and follow-up steps can be lost at the exact moment a family is least prepared to manage them.<\u002Fp>\n        <p style=\"font:var(--text-h4);font-family:var(--font-display);color:var(--text-strong)\">That is why I created TLV Patient Care.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-violet);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container-narrow);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start\">\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"quote\" size=\"40px\" color=\"var(--green-300)\" hint-size=\"40px,40px\"><\u002Fx-import>\n      <p style=\"font:var(--text-h3);font-family:var(--font-display);color:var(--warm-0);text-wrap:balance\">My goal is not to take over a client's healthcare forever. My goal is to help people feel more informed, more prepared, and more confident managing their own healthcare and communicating with their care team.<\u002Fp>\n      <span style=\"font:var(--text-small-role);color:var(--violet-50);letter-spacing:var(--tracking-caps);text-transform:uppercase\">Terry Vincent, founder<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-card);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:.8fr 1.2fr;gap:var(--space-10);align-items:flex-start\">\n      <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:16ch\">How I help<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-6);max-width:var(--measure)\">\n        <p style=\"font:var(--text-lead);color:var(--text-body)\">I work with seniors, adult children, and family caregivers to make healthcare information easier to understand and the next steps easier to manage.<\u002Fp>\n        <p>Depending on the client's needs, I can help set up and navigate patient portals, organize records, prepare questions for appointments, attend appointments as an advocate and note-taker, research reliable information, and help families keep track of what happens next.<\u002Fp>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Card\" tone=\"soft\" icon=\"shield-check\" title=\"My role and professional boundaries\" hint-size=\"100%,260px\">\n          <p style=\"margin:0 0 var(--space-4)\">I do not diagnose conditions, prescribe medication, or advise clients which treatment to choose. I serve as an educator, researcher, advocate, and logistics guide. Medical decisions remain between the client and their licensed healthcare professionals.<\u002Fp>\n          <p style=\"margin:0\">TLV Patient Care is independent from hospitals, medical facilities, and insurance companies. My responsibility is to the client and family I am supporting.<\u002Fp>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ goServices }}\" icon-right=\"arrow-right\" hint-size=\"auto,56px\">See the packages<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--surface-page);padding:var(--section-y) var(--space-7)\">\n    <div style=\"max-width:var(--container);margin:0 auto\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-9)\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">Credentials and relevant experience<\u002Fspan>\n        <h2 style=\"font:var(--text-h2);color:var(--text-strong);max-width:22ch\">Twenty-three years in healthcare, and a lifetime of caregiving<\u002Fh2>\n      <\u002Fdiv>\n      <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4) var(--space-9)\">\n        <li style=\"display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-4) 0;border-top:1px solid var(--border-subtle)\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"graduation-cap\" size=\"24px\" color=\"var(--brand)\" hint-size=\"24px,24px\"><\u002Fx-import><span>Bachelor of Arts in Psychology, Golden Gate University, magna cum laude, 2002<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-4) 0;border-top:1px solid var(--border-subtle)\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"award\" size=\"24px\" color=\"var(--brand)\" hint-size=\"24px,24px\"><\u002Fx-import><span>Retired Principal Surgical Technologist<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-4) 0;border-top:1px solid var(--border-subtle)\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"building-2\" size=\"24px\" color=\"var(--brand)\" hint-size=\"24px,24px\"><\u002Fx-import><span>Former UCSF Radiation Oncology staff member<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-4) 0;border-top:1px solid var(--border-subtle)\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"activity\" size=\"24px\" color=\"var(--brand)\" hint-size=\"24px,24px\"><\u002Fx-import><span>Operating Room and ICU first-responder experience during the COVID pandemic<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-4) 0;border-top:1px solid var(--border-subtle)\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"house-heart\" size=\"24px\" color=\"var(--brand)\" hint-size=\"24px,24px\"><\u002Fx-import><span>In-Home Support Professional<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-4) 0;border-top:1px solid var(--border-subtle)\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"lock\" size=\"24px\" color=\"var(--brand)\" hint-size=\"24px,24px\"><\u002Fx-import><span>Extensive experience working under HIPAA and patient privacy requirements<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-4) 0;border-top:1px solid var(--border-subtle)\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"briefcase\" size=\"24px\" color=\"var(--brand)\" hint-size=\"24px,24px\"><\u002Fx-import><span>Professional experience in human resources, benefits, payroll, training, and client support<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-4) 0;border-top:1px solid var(--border-subtle)\"><x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"heart-handshake\" size=\"24px\" color=\"var(--brand)\" hint-size=\"24px,24px\"><\u002Fx-import><span>Decades of firsthand family caregiving and healthcare advocacy experience<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"tlv-book-about\" style=\"background:var(--gradient-dusk);padding:var(--section-y-lg) var(--space-7)\">\n    <div style=\"max-width:var(--container-narrow);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6);align-items:center;text-align:center\">\n      <h2 style=\"font:var(--text-h1);color:var(--warm-0);max-width:24ch\">Every family deserves a clearer path forward.<\u002Fh2>\n      <p style=\"font:var(--text-lead);color:var(--violet-50);max-width:50ch\">When healthcare feels confusing or difficult to manage, you do not have to figure out every detail alone. Let's talk about what your family needs and the support that may help.<\u002Fp>\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"inverse\" size=\"lg\" icon-left=\"calendar-check\" sc-camel-on-click=\"{{ book }}\" hint-size=\"auto,64px\">Book a free 30-minute consultation<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ bookingOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeBooking }}\" style=\"position:fixed;inset:0;z-index:80;background:rgba(10,50,58,.48);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:var(--space-8) var(--space-6);overflow-y:auto\">\n  <div sc-camel-on-click=\"{{ stop }}\" role=\"dialog\" aria-modal=\"true\" style=\"width:100%;max-width:940px;background:var(--surface-card);border-radius:var(--radius-2xl);box-shadow:var(--shadow-xl);overflow:hidden\">\n    <div style=\"height:6px;background:var(--gradient-hope)\"><\u002Fdiv>\n\n    <div style=\"display:flex;align-items:flex-start;gap:var(--space-5);padding:var(--space-7) var(--space-8) var(--space-5)\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-2)\">\n        <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--teal-600)\">Free consultation · 30 minutes<\u002Fspan>\n        <h2 style=\"font:var(--text-h3);color:var(--text-strong)\">{{ stepTitle }}<\u002Fh2>\n        <p style=\"font:var(--text-body-role);color:var(--text-muted);max-width:56ch\">{{ stepBlurb }}<\u002Fp>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeBooking }}\" aria-label=\"Close\" style=\"margin-inline-start:auto;flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--border-subtle);background:var(--surface-card);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--dur-1,.15s) ease\" style-hover=\"background:var(--teal-50);color:var(--teal-800)\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"x\" size=\"24px\" hint-size=\"24px,24px\"><\u002Fx-import>\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:var(--space-2);padding:0 var(--space-8) var(--space-6)\">\n      <span style=\"flex:1;height:5px;border-radius:var(--radius-pill);background:{{ bar1 }}\"><\u002Fspan>\n      <span style=\"flex:1;height:5px;border-radius:var(--radius-pill);background:{{ bar2 }}\"><\u002Fspan>\n      <span style=\"flex:1;height:5px;border-radius:var(--radius-pill);background:{{ bar3 }}\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:1.25fr .95fr;gap:var(--space-8);padding:0 var(--space-8) var(--space-8)\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-5)\">\n        <div style=\"display:flex;align-items:center;gap:var(--space-4)\">\n          <button sc-camel-on-click=\"{{ prevMonth }}\" aria-label=\"Previous month\" style=\"width:48px;height:48px;border-radius:50%;border:2px solid var(--border-subtle);background:var(--surface-card);cursor:pointer;color:var(--teal-700);display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--teal-50)\">\n            <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"chevron-left\" size=\"24px\" hint-size=\"24px,24px\"><\u002Fx-import>\n          <\u002Fbutton>\n          <span style=\"font-family:var(--font-display);font-size:var(--size-h5);font-weight:600;color:var(--text-strong);min-width:11ch;text-align:center\">{{ monthLabel }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ nextMonth }}\" aria-label=\"Next month\" style=\"width:48px;height:48px;border-radius:50%;border:2px solid var(--border-subtle);background:var(--surface-card);cursor:pointer;color:var(--teal-700);display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--teal-50)\">\n            <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"chevron-right\" size=\"24px\" hint-size=\"24px,24px\"><\u002Fx-import>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:6px\">\n          <sc-for list=\"{{ dayNames }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <span style=\"text-align:center;font-family:var(--font-display);font-size:var(--size-caption);font-weight:600;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);padding-bottom:var(--space-2)\">{{ d }}<\u002Fspan>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ cells }}\" as=\"c\" hint-placeholder-count=\"35\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" disabled=\"{{ c.disabled }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font:var(--text-small-role);color:var(--text-muted)\">Weekdays, 8am – 6pm. Pacific time.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-4);min-width:0\">\n        <span style=\"font-family:var(--font-display);font-size:var(--size-body-lg);font-weight:600;color:var(--text-strong)\">{{ slotHeading }}<\u002Fspan>\n        <sc-if value=\"{{ hasDate }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;padding-inline-end:4px\">\n          <sc-for list=\"{{ slots }}\" as=\"s\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noDate }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font:var(--text-body-role);color:var(--text-muted)\">Pick a day on the left and the open times will appear here.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:center;justify-content:space-between;padding:var(--space-6) var(--space-8);border-top:1px solid var(--border-subtle);background:var(--surface-mist)\">\n      <span style=\"font:var(--text-body-role);color:var(--text-muted)\">No cost, no obligation. You do not have to decide today.<\u002Fspan>\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"primary\" size=\"lg\" icon-right=\"arrow-right\" disabled=\"{{ step1Incomplete }}\" sc-camel-on-click=\"{{ toStep2 }}\" hint-size=\"auto,64px\">Continue<\u002Fx-import>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-6);padding:0 var(--space-8) var(--space-8);max-width:680px\">\n      <div style=\"display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-5);background:var(--surface-accent-soft);border:1px solid var(--green-200);border-radius:var(--radius-md)\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"calendar-check\" size=\"24px\" color=\"var(--green-600)\" hint-size=\"24px,24px\"><\u002Fx-import>\n        <span style=\"font-family:var(--font-display);font-weight:600;color:var(--text-strong)\">{{ chosenLabel }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ toStep1 }}\" style=\"margin-inline-start:auto;min-height:44px;background:none;border:0;padding:0 4px;font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--teal-700);cursor:pointer;text-decoration:underline\">Change<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n        <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">Who is the call about?<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n          <sc-for list=\"{{ whoOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ whoIsOther }}\" hint-placeholder-val=\"{{ false }}\">\n        <input value=\"{{ fWhoOther }}\" sc-camel-on-change=\"{{ setWhoOther }}\" placeholder=\"Who are you calling about?\" style=\"height:56px;padding:0 16px;margin-top:4px;font-family:var(--font-body);font-size:var(--size-body);color:var(--text-strong);background:var(--surface-card);border:2px solid var(--border-strong);border-radius:var(--radius-md);max-width:420px\">\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n        <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">How would you like to meet?<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n          <sc-for list=\"{{ formatOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"{{ o.style }}\">\n              <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"{{ o.icon }}\" size=\"22px\" hint-size=\"22px,22px\"><\u002Fx-import>{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isInPerson }}\" hint-placeholder-val=\"{{ false }}\">\n        <label style=\"display:flex;flex-direction:column;gap:8px;margin-top:4px;max-width:520px\">\n          <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">Location<\u002Fspan>\n          <input value=\"{{ fLocation }}\" sc-camel-on-change=\"{{ setLocation }}\" placeholder=\"Home address, or the clinic where we should meet\" style=\"height:56px;padding:0 16px;font-family:var(--font-body);font-size:var(--size-body);color:var(--text-strong);background:var(--surface-card);border:2px solid var(--border-strong);border-radius:var(--radius-md)\">\n        <\u002Flabel>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)\">\n        <label style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">First name<\u002Fspan>\n          <input value=\"{{ fFirst }}\" sc-camel-on-change=\"{{ setFirst }}\" style=\"height:56px;padding:0 16px;font-family:var(--font-body);font-size:var(--size-body);color:var(--text-strong);background:var(--surface-card);border:2px solid var(--border-strong);border-radius:var(--radius-md)\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">Last name<\u002Fspan>\n          <input value=\"{{ fLast }}\" sc-camel-on-change=\"{{ setLast }}\" style=\"height:56px;padding:0 16px;font-family:var(--font-body);font-size:var(--size-body);color:var(--text-strong);background:var(--surface-card);border:2px solid var(--border-strong);border-radius:var(--radius-md)\">\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">Phone<\u002Fspan>\n        <input value=\"{{ fPhone }}\" sc-camel-on-change=\"{{ setPhone }}\" type=\"tel\" placeholder=\"(555) 000-0000\" style=\"height:56px;padding:0 16px;font-family:var(--font-body);font-size:var(--size-body);color:var(--text-strong);background:var(--surface-card);border:2px solid var(--border-strong);border-radius:var(--radius-md)\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">Email<\u002Fspan>\n        <input value=\"{{ fEmail }}\" sc-camel-on-change=\"{{ setEmail }}\" type=\"email\" placeholder=\"you@example.com\" style=\"height:56px;padding:0 16px;font-family:var(--font-body);font-size:var(--size-body);color:var(--text-strong);background:var(--surface-card);border:2px solid var(--border-strong);border-radius:var(--radius-md)\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">What is going on? <span style=\"font-weight:400;color:var(--text-muted)\">Optional<\u002Fspan><\u002Fspan>\n        <textarea value=\"{{ fNote }}\" sc-camel-on-change=\"{{ setNote }}\" rows=\"3\" placeholder=\"A sentence or two is plenty. You can tell us the rest on the call.\" style=\"padding:14px 16px;font-family:var(--font-body);font-size:var(--size-body);line-height:1.6;color:var(--text-strong);background:var(--surface-card);border:2px solid var(--border-strong);border-radius:var(--radius-md);resize:vertical\"><\u002Ftextarea>\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:center;justify-content:space-between;padding:var(--space-6) var(--space-8);border-top:1px solid var(--border-subtle);background:var(--surface-mist)\">\n      <button sc-camel-on-click=\"{{ toStep1 }}\" style=\"min-height:48px;background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--teal-700);cursor:pointer\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"chevron-left\" size=\"20px\" hint-size=\"20px,20px\"><\u002Fx-import>Back to times<\u002Fbutton>\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"cta\" size=\"lg\" icon-left=\"calendar-check\" disabled=\"{{ step2Incomplete }}\" sc-camel-on-click=\"{{ confirm }}\" hint-size=\"auto,64px\">Request my free call<\u002Fx-import>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start;padding:0 var(--space-8) var(--space-8);max-width:620px\">\n      <div style=\"width:72px;height:72px;border-radius:50%;background:var(--surface-accent-soft);border:1px solid var(--green-200);display:flex;align-items:center;justify-content:center\">\n        <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Icon\" name=\"check\" size=\"36px\" color=\"var(--green-600)\" hint-size=\"36px,36px\"><\u002Fx-import>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n        <span style=\"font:var(--text-h4);font-family:var(--font-display);color:var(--text-strong)\">{{ chosenLabel }}<\u002Fspan>\n        <span style=\"font:var(--text-body-role);color:var(--text-muted)\">{{ confirmLine }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-6);background:var(--surface-brand-soft);border:1px solid var(--teal-100);border-radius:var(--radius-lg);width:100%\">\n        <span style=\"font-family:var(--font-display);font-size:var(--size-body);font-weight:600;color:var(--text-strong)\">What happens next<\u002Fspan>\n        <span style=\"font:var(--text-body-role);color:var(--text-body)\">You will get a confirmation email within the hour, and we will contact you to confirm the details of your free consultation. Nothing is charged, and you do not have to decide anything on the call.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:flex-end;padding:var(--space-6) var(--space-8);border-top:1px solid var(--border-subtle);background:var(--surface-mist)\">\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Button\" variant=\"primary\" size=\"lg\" sc-camel-on-click=\"{{ closeBooking }}\" hint-size=\"auto,64px\">Done<\u002Fx-import>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<footer style=\"background:var(--surface-brand-deep);color:var(--teal-100);padding:var(--space-11) var(--space-7) var(--space-8)\">\n  <div style=\"max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:var(--space-9)\">\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-4);align-items:flex-start\">\n      <x-import component-from-global-scope=\"TLVPatientCareDesignSystem_158230.Wordmark\" form=\"long\" align=\"stack\" size=\"30\" color=\"var(--warm-0)\" hint-size=\"240px,60px\"><\u002Fx-import>\n      <p style=\"font:var(--text-body-role);color:var(--teal-100);max-width:34ch\">Independent patient advocacy and healthcare navigation for seniors and the families supporting them.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-3);align-items:flex-start\">\n      <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--mint-300)\">Pages<\u002Fspan>\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"background:none;border:0;padding:0;font:var(--text-body-role);color:var(--teal-100);cursor:pointer;text-align:start\">Home<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goServices }}\" style=\"background:none;border:0;padding:0;font:var(--text-body-role);color:var(--teal-100);cursor:pointer;text-align:start\">Services<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goAbout }}\" style=\"background:none;border:0;padding:0;font:var(--text-body-role);color:var(--teal-100);cursor:pointer;text-align:start\">About<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-3);align-items:flex-start\">\n      <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--mint-300)\">Packages<\u002Fspan>\n      <span style=\"font:var(--text-body-role);color:var(--teal-100)\">Educational<\u002Fspan>\n      <span style=\"font:var(--text-body-role);color:var(--teal-100)\">Premium<\u002Fspan>\n      <span style=\"font:var(--text-body-role);color:var(--teal-100)\">Specialty — surgical<\u002Fspan>\n      <span style=\"font:var(--text-body-role);color:var(--teal-100)\">Specialty — cancer<\u002Fspan>\n      <span style=\"font:var(--text-body-role);color:var(--teal-100)\">Monthly care retainer<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-3);align-items:flex-start\">\n      <span style=\"font:var(--text-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--mint-300)\">Get in touch<\u002Fspan>\n      <span style=\"font:var(--text-body-role);color:var(--teal-100)\">(555) 012-8834<\u002Fspan>\n      <span style=\"font:var(--text-body-role);color:var(--teal-100)\">tlvpatientadvocate@gmail.com<\u002Fspan>\n      <span style=\"font:var(--text-body-role);color:var(--teal-100)\">Mon–Fri, 8am – 6pm<\u002Fspan>\n      <span style=\"font:var(--text-small-role);color:var(--mint-300)\">A person answers.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:var(--container);margin:var(--space-9) auto 0;padding-top:var(--space-6);border-top:1px solid rgba(255,255,255,.14);display:flex;flex-wrap:wrap;gap:var(--space-5);justify-content:space-between;font:var(--text-small-role);color:var(--teal-200)\">\n    <span>© 2026 TLV Patient Care Consultants, LLC<\u002Fspan>\n    <span style=\"max-width:70ch\">TLV Patient Care does not provide medical advice, diagnosis, or treatment recommendations. We help you understand the advice you have already been given.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1200},&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;about&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'services'|'about'&quot;,&quot;section&quot;:&quot;Preview&quot;},&quot;headlineVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;C — more direct&quot;,&quot;Primary&quot;,&quot;B — more emotional&quot;,&quot;D — more problem-led&quot;],&quot;default&quot;:&quot;C — more direct&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Homepage hero&quot;},&quot;showTrustLine&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Homepage hero&quot;},&quot;showFaq&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Services page&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: null };\n\n  get page(){\n    return this.state.page || this.hashPage() || this.props.page || 'home';\n  }\n\n  hashPage(){\n    const h = (window.location.hash || '').replace('#','');\n    return ['home','services','about'].includes(h) ? h : null;\n  }\n\n  go = (p) => {\n    this.setState({page:p});\n    if(window.location.hash !== '#'+p) window.history.pushState(null,'','#'+p);\n    window.scrollTo({top:0,behavior:'auto'});\n  };\n\n  book = () => {\n    const now = new Date();\n    this.setState({\n      booking:{step:1, month:new Date(now.getFullYear(), now.getMonth(), 1), date:null, time:null,\n        who:'', whoOther:'', format:'', location:'', first:'', last:'', phone:'', email:'', note:''}\n    });\n    document.body.style.overflow = 'hidden';\n  };\n\n  closeBooking = () => { document.body.style.overflow = ''; this.setState({booking:null}); };\n  stop = (e) => { e.stopPropagation(); };\n  patch = (o) => this.setState(s => ({booking:{...s.booking, ...o}}));\n\n  fmtDate(d){\n    return d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});\n  }\n\n  buildCells(b){\n    const first = b.month;\n    const y = first.getFullYear(), m = first.getMonth();\n    const lead = first.getDay();\n    const days = new Date(y, m+1, 0).getDate();\n    const today = new Date(); today.setHours(0,0,0,0);\n    const horizon = new Date(today); horizon.setDate(horizon.getDate()+60);\n    const base = {height:'52px',border:'2px solid transparent',borderRadius:'var(--radius-pill)',\n      fontFamily:'var(--font-display)',fontSize:'var(--size-body)',fontWeight:600,background:'transparent'};\n    const cells = [];\n    for(let i=0;i<lead;i++) cells.push({label:'', disabled:true, style:{...base,visibility:'hidden'}, onClick:()=>{}});\n    for(let d=1; d<=days; d++){\n      const dt = new Date(y,m,d);\n      const weekend = dt.getDay()===0 || dt.getDay()===6;\n      const open = !weekend && dt > today && dt < horizon;\n      const sel = b.date && dt.getTime() === b.date.getTime();\n      let style;\n      if(sel) style = {...base, background:'var(--brand)', color:'var(--warm-0)', cursor:'pointer'};\n      else if(open) style = {...base, background:'var(--surface-brand-soft)', color:'var(--teal-800)',\n        borderColor:'var(--teal-100)', cursor:'pointer'};\n      else style = {...base, color:'var(--text-muted)', opacity:.45, cursor:'not-allowed'};\n      cells.push({label:String(d), disabled:!open, style,\n        onClick: open ? () => this.patch({date:dt, time:null}) : () => {}});\n    }\n    return cells;\n  }\n\n  buildSlots(b){\n    const times = ['8:00am','9:00am','10:00am','11:00am','1:00pm','2:00pm','3:00pm','4:00pm','5:00pm'];\n    const base = {minHeight:'52px',padding:'0 18px',borderRadius:'var(--radius-pill)',\n      fontFamily:'var(--font-display)',fontSize:'var(--size-body)',fontWeight:600,cursor:'pointer',\n      border:'2px solid var(--teal-100)',background:'var(--surface-card)',color:'var(--teal-800)',\n      textAlign:'center',width:'100%'};\n    return times.map(t => ({label:t, onClick:() => this.patch({time:t}),\n      style: b.time===t ? {...base, background:'var(--brand)', color:'var(--warm-0)', borderColor:'var(--brand)'} : base}));\n  }\n\n  pills(list, current, key){\n    const base = {minHeight:'48px',padding:'0 18px',borderRadius:'var(--radius-pill)',\n      fontFamily:'var(--font-display)',fontSize:'var(--size-body)',fontWeight:600,cursor:'pointer',\n      border:'2px solid var(--border-strong)',background:'var(--surface-card)',color:'var(--text-body)',\n      display:'inline-flex',alignItems:'center',gap:'10px'};\n    return list.map(o => {\n      const l = typeof o === 'string' ? o : o.label;\n      return {label:l, icon: typeof o === 'string' ? undefined : o.icon,\n        onClick:() => this.patch({[key]:l}),\n        style: current===l ? {...base, background:'var(--teal-50)', borderColor:'var(--teal-400)', color:'var(--teal-800)'} : base};\n    });\n  }\n\n  navVars(page){\n    const on = {background:'var(--teal-50)', color:'var(--teal-800)'};\n    const off = {background:'transparent', color:'var(--text-muted)'};\n    const v = {};\n    for(const p of ['home','services','about']){\n      const s = page===p ? on : off;\n      v['--nav-'+p+'-bg'] = s.background;\n      v['--nav-'+p+'-fg'] = s.color;\n    }\n    return v;\n  }\n\n  componentDidMount(){\n    const v = this.navVars(this.page);\n    for(const k in v) document.documentElement.style.setProperty(k, v[k]);\n    if(!this._scroll){\n      this._scroll = () => document.documentElement.style.setProperty(\n        '--hdr-shadow', window.scrollY > 12 ? '0 6px 24px -12px rgba(15,58,60,.34)' : 'none');\n      window.addEventListener('scroll', this._scroll, {passive:true});\n      this._scroll();\n    }\n    if(!this._hash){\n      this._hash = () => { const p = this.hashPage(); if(p) this.setState({page:p}); };\n      window.addEventListener('hashchange', this._hash);\n    }\n  }\n  componentDidUpdate(){ this.componentDidMount(); }\n  componentWillUnmount(){\n    if(this._scroll) window.removeEventListener('scroll', this._scroll);\n    if(this._hash) window.removeEventListener('hashchange', this._hash);\n  }\n\n  renderVals(){\n    const page = this.page;\n    const hl = this.props.headlineVariant || 'C \\u2014 more direct';\n    const link = React.createElement('button', {\n      onClick: () => this.go('about'),\n      style:{background:'none',border:0,padding:0,minHeight:44,display:'inline-flex',alignItems:'center',gap:8,\n        fontFamily:'var(--font-display)',fontSize:'var(--size-body)',fontWeight:600,color:'var(--teal-700)',cursor:'pointer'}\n    }, 'Read Terry\\u2019s story');\n    const badge = React.createElement('span', {\n      style:{display:'inline-flex',alignItems:'center',padding:'6px 14px',background:'var(--surface-accent-soft)',\n        color:'var(--green-800)',border:'1px solid var(--green-200)',borderRadius:'var(--radius-pill)',\n        font:'var(--text-small-role)',fontWeight:600}\n    }, 'Most families start here');\n    const b = this.state.booking;\n    const dim = 'var(--border-subtle)', lit = 'var(--brand)';\n    const titles = {1:'Pick a day and time that suits you', 2:'A few details, then we are set',\n      3:'Your call is booked'};\n    const blurbs = {1:'Thirty minutes on the phone or video. Bring a family member if you would like.',\n      2:'Only what we need to call you at the right time. Nothing is shared with anyone else.',\n      3:'A confirmation is on its way.'};\n    const booking = b ? {\n      bookingOpen:true,\n      isStep1: b.step===1, isStep2: b.step===2, isStep3: b.step===3,\n      stepTitle: titles[b.step], stepBlurb: blurbs[b.step],\n      bar1: lit, bar2: b.step>1 ? lit : dim, bar3: b.step>2 ? lit : dim,\n      monthLabel: b.month.toLocaleDateString('en-US',{month:'long', year:'numeric'}),\n      dayNames: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],\n      cells: this.buildCells(b),\n      slots: this.buildSlots(b),\n      hasDate: !!b.date, noDate: !b.date,\n      slotHeading: b.date ? this.fmtDate(b.date) : 'Open times',\n      step1Incomplete: !(b.date && b.time),\n      step2Incomplete: !(b.who && (b.who!=='Other' || b.whoOther.trim()) && b.format\n        && (b.format!=='In person' || b.location.trim())\n        && b.first.trim() && b.last.trim() && b.email.trim() && b.phone.trim()),\n      chosenLabel: b.date ? this.fmtDate(b.date) + ' at ' + b.time : '',\n      confirmLine: [b.format, b.who ? 'about ' + (b.who==='Other' ? b.whoOther : b.who.toLowerCase()) : '']\n        .filter(Boolean).join(' · '),\n      whoOptions: this.pills(['Myself','My parent','Another family member','Other'], b.who, 'who'),\n      whoIsOther: b.who==='Other',\n      isInPerson: b.format==='In person',\n      formatOptions: this.pills([\n        {label:'Phone call', icon:'phone'},\n        {label:'Video call', icon:'video'},\n        {label:'In person', icon:'home'}], b.format, 'format'),\n      fFirst:b.first, fLast:b.last, fWhoOther:b.whoOther, fLocation:b.location,\n      fPhone:b.phone, fEmail:b.email, fNote:b.note,\n      setFirst:(e)=>this.patch({first:e.target.value}),\n      setLast:(e)=>this.patch({last:e.target.value}),\n      setWhoOther:(e)=>this.patch({whoOther:e.target.value}),\n      setLocation:(e)=>this.patch({location:e.target.value}),\n      setPhone:(e)=>this.patch({phone:e.target.value}),\n      setEmail:(e)=>this.patch({email:e.target.value}),\n      setNote:(e)=>this.patch({note:e.target.value}),\n      prevMonth: () => this.patch({month:new Date(b.month.getFullYear(), b.month.getMonth()-1, 1)}),\n      nextMonth: () => this.patch({month:new Date(b.month.getFullYear(), b.month.getMonth()+1, 1)}),\n      toStep1: () => this.patch({step:1}),\n      toStep2: () => this.patch({step:2}),\n      confirm: () => this.patch({step:3}),\n      closeBooking: this.closeBooking, stop: this.stop\n    } : {bookingOpen:false, closeBooking:this.closeBooking, stop:this.stop};\n\n    return {\n      ...booking,\n      isHome: page==='home', isServices: page==='services', isAbout: page==='about',\n      goHome: () => this.go('home'), goServices: () => this.go('services'), goAbout: () => this.go('about'),\n      book: this.book,\n      hlPrimary: hl==='Primary', hlB: hl==='B \\u2014 more emotional',\n      hlC: hl==='C \\u2014 more direct', hlD: hl==='D \\u2014 more problem-led',\n      showTrust: this.props.showTrustLine !== false,\n      showFaq: this.props.showFaq !== false,\n      stepCurrent: 0,\n      faqWidth: {width:'100%'},\n      aboutLink: link,\n      mostFamilies: badge,\n      steps: [\n        {label:'A free 30-minute call', note:'Tell us what has happened. We will explain what we can help with and what we cannot.'},\n        {label:'A written access proxy', note:'You sign a proxy that lets us see the record. Nothing happens before that.'},\n        {label:'The first working session', note:'Portals, records and the medication list, sorted out at your parent\\u2019s pace.'},\n        {label:'Before the appointment', note:'Labs and scans reviewed together, and the questions written down.'},\n        {label:'In the room, and afterwards', note:'We take the notes so your parent can listen, then explain it again in plain language.'}\n      ],\n      faq: [\n        {q:'Do you make medical decisions for us?', a:'No. We do not diagnose, prescribe, or tell you which treatment to choose. We explain the information you have been given, help you prepare the questions, and keep the next steps organized. The decisions stay with your family and your licensed healthcare professionals.'},\n        {q:'Are you connected to a hospital or insurer?', a:'No. TLV Patient Care is independent from hospitals, medical facilities, and insurance companies. Our responsibility is to the client and family we are supporting.'},\n        {q:'What does it cost?', a:'Each package is a flat fee, agreed before anything begins, with a monthly option for ongoing support. Prices are not listed here because the right package depends on what you are facing. We will walk you through it on your free call.'},\n        {q:'Can you help if I live in another city?', a:'Yes. Many families work this way. Your advocate can be in the room with your parent while you join by phone or video, and follows up with you directly afterwards.'},\n        {q:'How do you get access to my parent\\u2019s records?', a:'Through a signed written proxy. It names your advocate specifically, and your parent can withdraw it at any time.'},\n        {q:'Does insurance cover this?', a:'No. We are a private service and do not bill insurance.'}\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
